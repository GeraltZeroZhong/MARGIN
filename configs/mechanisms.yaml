schema_version: mechanisms.v1
seed: 20260817

paths:
  project_root: ..
  run_dir: runs/mechanisms
  storage_dir: data/workspaces/mechanisms
  foundation_config: configs/foundation.yaml
  generalization_config: configs/generalization.yaml
  generalization_run: runs/generalization
  counterfactual_run: runs/counterfactuals
  observability_replication_run: runs/observability/replication
  megascale_archive: data/external/tsuboyama/7844779/Processed_K50_dG_datasets.zip
  megascale_structures: data/external/tsuboyama/7992926/AlphaFold_model_PDBs
  aaindex1: data/external/aaindex/aaindex1
  mmseqs_executable: tools/mmseqs/bin/mmseqs
  sequence_models_repository: external/repositories/protein-sequence-models
  mif_checkpoint: models/protein_sequence_models/mif.pt

panel:
  megascale_member: Processed_K50_dG_datasets/Tsuboyama2023_Dataset2_Dataset3_20230416.csv
  minimum_single_variants: 500
  minimum_unique_positions: 30
  natural_domains: 16
  de_novo_domains_per_family: 2
  de_novo_families: [EA, GG, XX, EHEE, EEHEE, HEEH, HHH, trRosetta_hallucination]
  near_duplicate_identity: 0.80
  near_duplicate_minimum_coverage: 0.90
  homology_evalue: 0.001
  homology_sensitivity: 7.5
  homology_threads: 8
  require_complete_backbone: true
  matched_real_decoys: 3
  matched_real_maximum_source_length_excess: 20

counterfactuals:
  seeds: [0, 1, 2, 3, 4]
  contact_deletion_fractions: [0.05, 0.10, 0.20]
  coordinate_rmsd_angstrom: [0.25, 0.50, 1.00]
  coordinate_low_frequency_modes: 3
  maximum_adjacent_ca_distance_change_angstrom: 0.25
  constrained_reassignment_fraction: 0.10
  constrained_max_attempts_per_swap: 500
  legacy_rewiring_swaps_per_edge: 5.0
  legacy_rewire_max_attempts_per_swap: 25
  contact_distance_angstrom: 8.0
  contact_minimum_sequence_separation: 3

models:
  sequence_model_id: esm2_150M
  predictor_model_id: carp_640M
  rrr_rank: 16
  ridge_alpha: 10.0
  context_ridge_alpha: 10.0
  direct_pca_ranks: [1, 3, 5, 16]
  mif_batch_size: 2

inference:
  confidence_level: 0.95
  bootstrap_replicates: 5000
  top_fraction: 0.10
  relevance_transform: domain_shifted_nonnegative
  id_jsd_max_nats: 0.10
  id_absolute_entropy_shift_max_nats: 0.25
  id_minimum_domain_fraction: 0.80
  seed_reliability_minimum_spearman: 0.50
  robust_minimum_counterfactual_families: 2
  require_margin_ci_lower_positive: true
