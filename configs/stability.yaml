schema_version: stability.v1
seed: 20260819

paths:
  project_root: ..
  run_dir: runs/stability
  storage_dir: data/workspaces/stability
  foundation_config: configs/observability_replication.yaml
  generalization_config: configs/generalization.yaml
  observability_replication_run: runs/observability/replication
  generalization_run: runs/generalization
  counterfactual_run: runs/counterfactuals
  mechanism_run: runs/mechanisms
  action_validation_run: runs/action_validation
  megascale_archive: data/external/tsuboyama/7844779/Processed_K50_dG_datasets.zip
  megascale_structures: data/external/tsuboyama/7992926/AlphaFold_model_PDBs
  protein_gym_metadata: data/external/proteingym_DMS_substitutions.csv
  protein_gym_substitutions: data/external/DMS_ProteinGym_substitutions_v1.3.zip
  protein_gym_structures: data/external/proteingym/v1.3/structures
  protein_gym_msa_archive: data/external/DMS_msa_files_v1.3.zip
  mmseqs_executable: tools/mmseqs/bin/mmseqs
  sequence_models_repository: external/repositories/protein-sequence-models
  mif_checkpoint: models/protein_sequence_models/mif.pt
  proteinmpnn_repository: external/repositories/ProteinMPNN
  proteinmpnn_checkpoint: external/repositories/ProteinMPNN/vanilla_model_weights/v_48_020.pt
  esm_if1_repository: external/repositories/fair-esm
  esm_if1_checkpoint: models/esm_if1_gvp4_t16_142M_UR50.pt
  esm1b_hf_checkpoint: models/esm1b_t33_650M_UR50S_hf
  cath_queries: runs/generalization/architecture/query_rows.parquet
  cath_teacher_scores: runs/observability/replication/teacher_cache/scores.parquet
  cath_mif_scores: runs/generalization/mif/scores.parquet
  cath_carp640_store: data/workspaces/generalization/architecture/carp_640M
  cath_esm2_150_store: data/workspaces/mechanisms/training_controls/esm2_150M_cath
  cath_esm2_650_store: data/workspaces/generalization/architecture/esm2_650M
  cath_esm1b_650_store: data/workspaces/generalization/architecture/esm1b_650M
  cath_conservation_alignments: runs/observability/replication/conservation/alignments.tsv
  cath_fasta: data/external/cath/v4_4_0/cath-domain-seqs-v4_4_0.fa

panel:
  megascale_member: Processed_K50_dG_datasets/Tsuboyama2023_Dataset2_Dataset3_20230416.csv
  minimum_single_variants: 500
  minimum_unique_positions: 30
  natural_domains: 16
  de_novo_domains_per_family: 2
  de_novo_families: [EA, GG, XX, EHEE, EEHEE, HEEH, HHH, trRosetta_hallucination]
  external_assay_id: ESTA_BACSU_Nutschel_2020
  external_structure_file: ESTA_BACSU.pdb
  external_minimum_variants: 2000
  external_minimum_positions: 150
  near_duplicate_identity: 0.80
  near_duplicate_minimum_coverage: 0.90
  homology_evalue: 0.001
  homology_sensitivity: 7.5
  homology_threads: 8
  require_complete_backbone: true

calibration:
  teacher_ids: [mif, esm_if1, proteinmpnn]
  sequence_model_id: esm2_150M
  schemes:
    - unscaled_equal
    - action_rms_matched
    - joint_temperature_native_nll
    - rowwise_rank_normalized
  selection_metric: native_nll
  training_split: development_train
  selection_split: development_validation
  final_training_splits: [development_train, development_validation]
  temperature_minimum: 0.25
  temperature_maximum: 4.0
  rank_scale_minimum: 0.25
  rank_scale_maximum: 4.0
  proteinmpnn_order_repeats: 8
  mif_batch_size: 4

strong_control:
  enabled: true
  representation_models: [carp_640M, esm2_650M, esm1b_650M]
  representation_pca_components: 48
  local_context_radius: 8
  profile_pseudocount: 0.5
  profile_minimum_identity: 0.20
  profile_maximum_identity: 0.80
  profile_minimum_query_coverage: 0.70
  ridge_alphas: [1.0, 10.0, 100.0]
  mlp_hidden_sizes: [64, 128]
  mlp_alphas: [0.001, 0.01]
  model_selection_metric: anchored_action_rmse

inference:
  confidence_level: 0.95
  bootstrap_replicates: 5000
  external_position_bootstrap_replicates: 5000
  position_shuffle_repeats: 20
  top_fraction: 0.10
  minimum_teacher_replications: 2
  require_primary_spearman_ci_lower_positive: true
  require_primary_ndcg_ci_lower_positive: true
  require_both_megascale_strata_point_positive: true
  require_external_spearman_ci_lower_positive: true
  require_external_ndcg_point_positive: true
  require_strong_control_spearman_ci_lower_positive: true
