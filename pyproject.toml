[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "margin"
version = "0.1.0"
description = "Modality attribution of residual gain in inverse-folding networks"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "biopython>=1.84",
  "matplotlib>=3.9",
  "numpy>=2.0",
  "pandas>=2.2",
  "pyarrow>=16",
  "pydantic>=2.10",
  "PyYAML>=6.0",
  "scikit-learn>=1.5",
  "scipy>=1.14",
]

[project.optional-dependencies]
dev = [
  "build>=1.2",
  "pytest>=8.3",
  "ruff>=0.9",
]
models = [
  "omegaconf>=2.3",
  "torch>=2.2",
  "transformers>=4.48,<5",
]

[project.scripts]
margin = "margin.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
"src/margin/analysis/report.py" = ["E501"]
"src/margin/studies/action_validation/report.py" = ["E501"]
"src/margin/studies/generalization/report.py" = ["E501"]
"src/margin/studies/stability/report.py" = ["E501"]
